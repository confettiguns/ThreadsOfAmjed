<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreadsOfAmjed</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .welcome {
      text-align: center;
      max-width: 500px;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      opacity: 0;
    }
    h1 {
      color: #6b4a8b;
      margin-bottom: 16px;
    }
    p {
      color: #6b4a8b;
      margin-bottom: 24px;
    }
    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    button {
      background: #6b4a8b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #8d6bb5;
    }
  </style>
</head>
<body>
  <div class="welcome" id="welcome">
    <img src="assets/images/amjed.jpg" alt="Amjed">
    <h1>Welcome to ThreadsOfAmjed</h1>
    <p>Discover the story of Amjed and the family that surrounds him.</p>
    <button id="startBtn">Start the Journey</button>
  </div>

  <!-- GSAP from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <script>
    // Animate the welcome box in
    gsap.to("#welcome", { 
      opacity: 1, 
      y: -20, 
      duration: 1.5, 
      ease: "power2.out" 
    });

    // Alert when button is clicked
    document.getElementById("startBtn").addEventListener("click", function() {
      alert("Let’s begin the celebration!");
    });
  </script>
</body>
</html>
